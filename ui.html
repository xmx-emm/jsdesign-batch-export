<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; background: #fff; }
  .wrap { padding: 12px; }
  h3 { margin: 14px 0 6px; font-size: 12px; color: #666; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .sel { padding: 8px 10px; background: #f4f5f7; border-radius: 6px; }
  .sel b { color: #2f6bff; }
  label.opt { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; }
  .row { display: flex; gap: 6px; align-items: center; }
  .preset { border: 1px solid #e5e6eb; border-radius: 6px; padding: 8px; margin-bottom: 6px; }
  .preset .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preset .desc { color: #888; margin-top: 2px; word-break: break-all; }
  button { font: inherit; border: 1px solid #d0d3d9; background: #fff; border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: #2f6bff; color: #2f6bff; }
  button.primary { background: #2f6bff; border-color: #2f6bff; color: #fff; }
  button.primary:hover { background: #1f58e6; color: #fff; }
  button.link { border: none; padding: 2px 4px; color: #2f6bff; background: none; }
  button.danger:hover { color: #e5484d; border-color: #e5484d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select { font: inherit; border: 1px solid #d0d3d9; border-radius: 4px; padding: 3px 5px; min-width: 0; }
  .editor { border: 1px solid #2f6bff; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #f8faff; }
  .spec { display: grid; grid-template-columns: 58px 64px 46px 1fr 1fr 22px; gap: 4px; margin-top: 4px; }
  .spec-head { color: #888; }
  .progress { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; width: 0; background: #2f6bff; transition: width .15s; }
  .status { margin-top: 4px; color: #666; min-height: 18px; }
  .err { color: #e5484d; }
  .muted { color: #888; }
  textarea { width: 100%; height: 90px; font: 11px monospace; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sel" id="sel">未选中图层</div>
  <label class="opt"><input type="checkbox" id="useChildren" checked />选中画板 / 编组时，导出其内部每个子图层</label>
  <label class="opt">
    输出方式
    <select id="output">
      <option value="zip">打包成一个 ZIP</option>
      <option value="files">逐个下载文件</option>
    </select>
  </label>

  <div class="progress"><i id="bar"></i></div>
  <div class="status" id="status"></div>

  <h3>导出预设 <span><button class="link" id="addBtn">+ 新建预设</button></span></h3>
  <div id="editorBox"></div>
  <div id="list"></div>

  <h3>其他</h3>
  <div class="row" style="flex-wrap: wrap;">
    <button id="ownBtn" title="使用每个图层右侧面板里已配置的导出设置">按图层自带导出设置导出</button>
    <button id="ioBtn">导入 / 导出预设</button>
    <button id="resetBtn" class="danger">恢复默认预设</button>
  </div>
  <div id="ioBox" style="display:none; margin-top:6px;">
    <textarea id="ioText"></textarea>
    <div class="row" style="margin-top:4px;"><button id="ioApply" class="primary">应用粘贴的 JSON</button><span class="muted">复制上面的内容即可备份 / 分享</span></div>
  </div>
</div>

<script>
// ---------- 最小 ZIP 写入（store，不压缩，支持 UTF-8 文件名） ----------
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function buildZip(files) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

  files.forEach(function (f) {
    const name = enc.encode(f.path);
    const data = f.bytes;
    const crc = crc32(data);

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true); // UTF-8 文件名
    local.setUint16(8, 0, true);
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, name.length, true);
    local.setUint16(28, 0, true);
    chunks.push(new Uint8Array(local.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + data.length;
  });

  const cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
}

// ---------- 工具 ----------
const MIME = { PNG: 'image/png', JPG: 'image/jpeg', SVG: 'image/svg+xml', PDF: 'application/pdf' };
const EXT = { PNG: 'png', JPG: 'jpg', SVG: 'svg', PDF: 'pdf' };
const CASES = { keep: '保持原名', lower: '小写', kebab: 'kebab-case', snake: 'snake_case' };

function $(id) { return document.getElementById(id); }
function send(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function formatName(name, mode) {
  let n = String(name).trim().replace(/[\\/:*?"<>|]+/g, '_');
  if (mode === 'lower') n = n.toLowerCase();
  if (mode === 'kebab' || mode === 'snake') {
    const sep = mode === 'kebab' ? '-' : '_';
    n = n.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase().replace(/[\s\-_.]+/g, sep).replace(new RegExp('^' + sep + '+|' + sep + '+$', 'g'), '');
  }
  return n || 'unnamed';
}

function specLabel(s) {
  let size = '';
  if (s.format === 'PNG' || s.format === 'JPG') {
    size = s.constraintType === 'WIDTH' ? ' w' + s.value : s.constraintType === 'HEIGHT' ? ' h' + s.value : ' @' + s.value + 'x';
  }
  return (s.folder ? s.folder + '/' : '') + s.format + size + (s.suffix ? ' "' + s.suffix + '"' : '');
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------- 状态 ----------
let presets = [];
let editing = null; // 正在编辑的预设副本
let job = null;     // 当前导出任务

function savePresets() { send({ type: 'save-presets', presets: presets }); }

function renderList() {
  const list = $('list');
  if (!presets.length) {
    list.innerHTML = '<div class="muted">还没有预设，点击「新建预设」添加</div>';
    return;
  }
  list.innerHTML = presets.map(function (p, i) {
    return '<div class="preset">' +
      '<div class="row"><span class="title">' + esc(p.name) + '</span>' +
      '<button class="primary" data-act="run" data-i="' + i + '">导出</button>' +
      '<button class="link" data-act="edit" data-i="' + i + '">编辑</button>' +
      '<button class="link" data-act="up" data-i="' + i + '" title="上移">↑</button>' +
      '<button class="link danger" data-act="del" data-i="' + i + '">删除</button></div>' +
      '<div class="desc">' + esc(CASES[p.nameCase] || '保持原名') + ' · ' + p.specs.map(function (s) { return esc(specLabel(s)); }).join('，') + '</div>' +
      '</div>';
  }).join('');
}

function renderEditor() {
  const box = $('editorBox');
  if (!editing) { box.innerHTML = ''; return; }
  box.innerHTML =
    '<div class="editor">' +
    '<div class="row"><input id="eName" style="flex:1" placeholder="预设名称" value="' + esc(editing.name) + '" />' +
    '<select id="eCase">' + Object.keys(CASES).map(function (k) { return '<option value="' + k + '"' + (editing.nameCase === k ? ' selected' : '') + '>' + CASES[k] + '</option>'; }).join('') + '</select></div>' +
    '<div class="spec spec-head" style="margin-top:8px"><span>格式</span><span>尺寸方式</span><span>数值</span><span>文件名后缀</span><span>子文件夹</span><span></span></div>' +
    editing.specs.map(function (s, i) {
      const raster = s.format === 'PNG' || s.format === 'JPG';
      return '<div class="spec" data-i="' + i + '">' +
        '<select data-k="format">' + ['PNG', 'JPG', 'SVG', 'PDF'].map(function (f) { return '<option' + (s.format === f ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select>' +
        '<select data-k="constraintType"' + (raster ? '' : ' disabled') + '>' +
          [['SCALE', '倍率'], ['WIDTH', '宽度'], ['HEIGHT', '高度']].map(function (c) { return '<option value="' + c[0] + '"' + (s.constraintType === c[0] ? ' selected' : '') + '>' + c[1] + '</option>'; }).join('') +
        '</select>' +
        '<input data-k="value" type="number" step="0.5" min="0.01" value="' + esc(s.value) + '"' + (raster ? '' : ' disabled') + ' />' +
        '<input data-k="suffix" placeholder="如 @2x" value="' + esc(s.suffix || '') + '" />' +
        '<input data-k="folder" placeholder="可留空" value="' + esc(s.folder || '') + '" />' +
        '<button class="link danger" data-act="rmSpec" title="删除这一行">×</button>' +
        '</div>';
    }).join('') +
    '<div class="row" style="margin-top:8px"><button class="link" data-act="addSpec">+ 添加一种尺寸 / 格式</button><span style="flex:1"></span>' +
    '<button data-act="cancel">取消</button><button class="primary" data-act="save">保存预设</button></div>' +
    '</div>';
}

function readEditor() {
  if (!editing) return;
  editing.name = $('eName').value.trim();
  editing.nameCase = $('eCase').value;
  document.querySelectorAll('#editorBox .spec[data-i]').forEach(function (row) {
    const s = editing.specs[Number(row.dataset.i)];
    row.querySelectorAll('[data-k]').forEach(function (el) {
      s[el.dataset.k] = el.dataset.k === 'value' ? Number(el.value) : el.value;
    });
  });
}

function setStatus(text, isErr) {
  $('status').innerHTML = isErr ? '<span class="err">' + esc(text) + '</span>' : esc(text);
}

function setBusy(b) {
  document.querySelectorAll('[data-act="run"], #ownBtn').forEach(function (el) { el.disabled = b; });
}

function startExport(type, preset) {
  job = { mode: $('output').value, nameCase: preset ? preset.nameCase : 'keep', files: [], errors: [], used: {}, total: 0, ok: 0, presetName: preset ? preset.name : 'export' };
  send({ type: type, preset: preset, useChildren: $('useChildren').checked });
}

function uniquePath(path) {
  if (!job.used[path]) { job.used[path] = 1; return path; }
  const dot = path.lastIndexOf('.');
  let n = job.used[path] + 1;
  let candidate;
  do { candidate = path.slice(0, dot) + '_' + n + path.slice(dot); n++; } while (job.used[candidate]);
  job.used[path] = n - 1;
  job.used[candidate] = 1;
  return candidate;
}

// ---------- 事件 ----------
$('list').addEventListener('click', function (e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  const act = btn.dataset.act;
  if (act === 'run') startExport('export', presets[i]);
  if (act === 'edit') { editing = JSON.parse(JSON.stringify(presets[i])); renderEditor(); }
  if (act === 'del' && confirm('删除预设「' + presets[i].name + '」？')) { presets.splice(i, 1); savePresets(); renderList(); }
  if (act === 'up' && i > 0) { presets.splice(i - 1, 0, presets.splice(i, 1)[0]); savePresets(); renderList(); }
});

$('editorBox').addEventListener('change', function (e) {
  if (e.target.dataset.k === 'format') { readEditor(); renderEditor(); }
});

$('editorBox').addEventListener('click', function (e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  readEditor();
  const act = btn.dataset.act;
  if (act === 'addSpec') {
    const last = editing.specs[editing.specs.length - 1];
    editing.specs.push(last ? Object.assign({}, last, { value: (Number(last.value) || 1) + 1, suffix: '@' + ((Number(last.value) || 1) + 1) + 'x' }) : { format: 'PNG', constraintType: 'SCALE', value: 1, suffix: '', folder: '' });
    renderEditor();
  } else if (act === 'rmSpec') {
    editing.specs.splice(Number(btn.closest('.spec').dataset.i), 1);
    renderEditor();
  } else if (act === 'cancel') {
    editing = null;
    renderEditor();
  } else if (act === 'save') {
    if (!editing.name) { setStatus('请填写预设名称', true); return; }
    if (!editing.specs.length) { setStatus('至少添加一种尺寸 / 格式', true); return; }
    const idx = presets.findIndex(function (p) { return p.id === editing.id; });
    if (idx >= 0) presets[idx] = editing; else presets.push(editing);
    editing = null;
    savePresets();
    renderEditor();
    renderList();
    setStatus('预设已保存');
  }
});

$('addBtn').onclick = function () {
  editing = { id: uid(), name: '', nameCase: 'keep', specs: [{ format: 'PNG', constraintType: 'SCALE', value: 1, suffix: '', folder: '' }] };
  renderEditor();
  $('eName').focus();
};
$('ownBtn').onclick = function () { startExport('export-own', null); };
$('resetBtn').onclick = function () { if (confirm('恢复默认预设会覆盖当前所有预设，确定？')) send({ type: 'reset-presets' }); };
$('ioBtn').onclick = function () {
  const box = $('ioBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  $('ioText').value = JSON.stringify(presets, null, 2);
};
$('ioApply').onclick = function () {
  try {
    const data = JSON.parse($('ioText').value);
    if (!Array.isArray(data) || data.some(function (p) { return !p.name || !Array.isArray(p.specs); })) throw new Error('格式不正确');
    data.forEach(function (p) { if (!p.id) p.id = uid(); });
    presets = data;
    savePresets();
    renderList();
    setStatus('已导入 ' + data.length + ' 个预设');
  } catch (err) {
    setStatus('导入失败：' + err.message, true);
  }
};

window.onmessage = function (event) {
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'presets') {
    presets = msg.presets || [];
    renderList();
  } else if (msg.type === 'selection') {
    $('sel').innerHTML = msg.count
      ? '已选中 <b>' + msg.count + '</b> 个图层' + (msg.count === 1 ? '「' + esc(msg.firstName) + '」' : '') + '，展开子图层后共 <b>' + msg.childCount + '</b> 个'
      : '未选中图层 —— 选中图标（或包含图标的画板）后点「导出」';
  } else if (msg.type === 'export-start') {
    if (!job) return;
    job.total = msg.total;
    setBusy(true);
    $('bar').style.width = '0';
    setStatus('导出中 0 / ' + msg.total);
  } else if (msg.type === 'file' || msg.type === 'file-error') {
    if (!job) return;
    if (msg.type === 'file') {
      const s = msg.spec;
      const folder = s.folder ? s.folder.replace(/^\/+|\/+$/g, '') + '/' : '';
      const path = uniquePath(folder + formatName(msg.name, job.nameCase) + (s.suffix || '') + '.' + EXT[s.format]);
      const bytes = msg.bytes instanceof Uint8Array ? msg.bytes : new Uint8Array(msg.bytes);
      if (job.mode === 'files') download(new Blob([bytes], { type: MIME[s.format] }), path.replace(/\//g, '_'));
      else job.files.push({ path: path, bytes: bytes });
    } else {
      job.errors.push(msg.name + '：' + msg.error);
    }
    if (msg.type === 'file') job.ok++;
    const count = job.ok + job.errors.length;
    $('bar').style.width = (count / job.total * 100) + '%';
    setStatus('导出中 ' + count + ' / ' + job.total);
  } else if (msg.type === 'export-done') {
    if (!job) return;
    setBusy(false);
    const ok = job.ok;
    if (job.mode === 'zip' && job.files.length) {
      const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
      download(buildZip(job.files), formatName(job.presetName, 'keep') + '_' + stamp + '.zip');
    }
    let text = '完成：' + ok + ' 个文件';
    if (job.errors.length) text += '，失败 ' + job.errors.length + ' 个（' + job.errors.slice(0, 3).join('；') + (job.errors.length > 3 ? '…' : '') + '）';
    setStatus(text, job.errors.length > 0 && ok === 0);
    send({ type: 'notify', text: text, error: job.errors.length > 0 });
    job = null;
  }
};

send({ type: 'init' });
</script>
</body>
</html>
